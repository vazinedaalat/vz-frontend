# Vite SPA — nginx-unprivileged (port 8080, non-root)
# Admin: set X-Frame-Options "DENY". Frontend: "SAMEORIGIN".

server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # ---- Security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP: tune connect-src/img-src to API + assets host; keep 'unsafe-inline' for styles only if Tailwind runtime needs it
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml font/woff2;

    # ---- Health (no logs) ----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ---- Hashed build assets: cache forever ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- Static files with fallback to SPA entry ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- index.html must never be cached (new deploys) ----
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- Deny dotfiles / source maps in prod (remove maps line if you ship them) ----
    location ~ /\. { deny all; }
    location ~ \.map$ { deny all; }
}
